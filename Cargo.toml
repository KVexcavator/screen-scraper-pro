[package]
name = "game-screen-scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = "0.12.1"
scrap = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
slint = "1.14.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.20.0", features = ["v4"] }
zbus = "5.13.2"

[build-dependencies]
slint-build = "1.14.1"
